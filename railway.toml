# Configuration Railway — déploiement via Dockerfile
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# IMPORTANT : monter un volume Railway sur /data pour persister la base
# Dans le dashboard Railway : Variables -> ajouter HRV_DB_PATH=/data/hrv_coach.db
# Volume -> mount path = /data
