# Configuration Railway — déploiement via Dockerfile
# Le startCommand est défini dans le Dockerfile (CMD avec sh -c pour expanser $PORT)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Volume Railway monté sur /data via le dashboard
# Variable d'env : HRV_DB_PATH=/data/hrv_coach.db
