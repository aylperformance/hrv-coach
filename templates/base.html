<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HRV Coach{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>❤</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand">
        <span class="brand-mark">HRV</span>
        <span class="brand-text">Coach</span>
      </a>
      <nav class="topnav">
        <a href="/">Athlètes</a>
        <a href="/tests/new">Importer un test</a>
        <a href="/athletes/new">Nouvel athlète</a>
      </nav>
    </div>
  </header>

  <main class="container content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <small>HRV Coach &middot; Analyse VFC couché-debout &middot; v1.0</small>
    </div>
  </footer>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
